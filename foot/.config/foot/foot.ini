[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=BitstromWera Nerd Font Mono:size=12
pad=10x10
initial-window-mode=windowed
workers=0

[colors-dark]
alpha=0.9

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+c Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Control+v Shift+Insert Control+Shift+v XF86Paste
# Alacritty-style vi selection: open scrollback in read-only nvim (v / V to select, y to yank)
pipe-scrollback=[sh -c "f=$(mktemp --suffix=.txt) && cat - > $f && foot nvim -R -c '$' $f; rm -f $f"] Control+Shift+space

[text-bindings]
# Ctrl+K sends interrupt, since Ctrl+C is copy (same as the Alacritty config)
\x03=Control+k
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
